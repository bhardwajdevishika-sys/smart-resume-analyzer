<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="ResumeIQ - AI Powered Resume Analyzer">

    <meta name="theme-color" content="#080b16">

    <title>
        {% block title %}
        ResumeIQ — AI Resume Analyzer
        {% endblock %}
    </title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <!-- Background Effects -->
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>


    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <div class="header-container">

            <a href="/" class="brand">

                <span class="brand-mark">
                    <i class="fa-solid fa-sparkles"></i>
                </span>

                <span>
                    Resume<span class="brand-accent">IQ</span>
                </span>

            </a>


            <nav class="top-nav">

                <a href="#features">
                    Features
                </a>

                <a href="#how-it-works">
                    How it works
                </a>

                <span class="nav-status">

                    <span></span>

                    AI Analysis

                </span>

            </nav>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer">

        <div class="footer-container">

            <span>
                © 2026 ResumeIQ
            </span>

            <span>
                Built for smarter job applications.
            </span>

        </div>

    </footer>


</body>
</html>
